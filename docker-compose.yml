version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: manufacturing-postgres
    environment:
      POSTGRES_DB: manufacturing_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - manufacturing-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: manufacturing-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - manufacturing-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: manufacturing-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/manufacturing_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: gemma3:12b
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - manufacturing-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: manufacturing-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - manufacturing-network
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:

networks:
  manufacturing-network:
    driver: bridge
